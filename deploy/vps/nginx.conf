# /etc/nginx/sites-available/recipes  (certbot --nginx adds HTTPS here)
server {
    listen 80;
    listen [::]:80;
    server_name recipes.antderosa.com;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, so visitors can't spoof it

    client_max_body_size 5m;   # recipe photos and avatars arrive as data URLs
    location / { proxy_pass http://127.0.0.1:4410; }
}
